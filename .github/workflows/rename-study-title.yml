name: Rename study title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-study-title.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace title in public files
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Does Cyprus Tech Have an EVP Problem?': 'What Makes Cyprus Tech Employer Brands Distinctive?',
              '<h1>Does Cyprus Tech Have an <em>EVP Problem?</em></h1>': '<h1>What Makes Cyprus Tech Employer Brands <em>Distinctive?</em></h1>',
          }

          for filename in ['index.html', 'README.md']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit title update
        run: |
          git config user.name 'olesiabositi-hub'
          git config user.email 'olesia.russi@gmail.com'
          git add index.html README.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Rename study to focus on distinctiveness'
            git push
          fi
