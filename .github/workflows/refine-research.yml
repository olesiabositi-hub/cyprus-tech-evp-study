name: Refine research presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-research.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine landing, methodology and README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- index.html ----------
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the consulting-style 90-day plan.
          text = re.sub(
              r'\n<section class="section soft">\n  <div class="shell"><p class="eyebrow">90-day action plan</p>.*?</section>\n',
              '\n', text, flags=re.S
          )

          # Make the evidence / interpretation / recommendation layers explicit.
          replacements = {
              '<p class="eyebrow">Core finding</p>': '<p class="eyebrow">Data · Core finding</p>',
              '<p class="eyebrow">Shared language</p>': '<p class="eyebrow">Data · Shared language</p>',
              '<p class="eyebrow">Interpretation</p>': '<p class="eyebrow">Interpretation</p>',
              '<p class="eyebrow">Why this matters</p>': '<p class="eyebrow">Interpretation · Why this matters</p>',
              '<p class="eyebrow">My strategic point of view</p>': '<p class="eyebrow">Recommendation · Strategic point of view</p>',
              '<p class="eyebrow">What Cyprus employers can do</p>': '<p class="eyebrow">Recommendations</p>',
              '<strong>Research snapshot:</strong> September 2026 · <strong>Version:</strong> 1.0': '<strong>Research snapshot:</strong> September 2026 · <strong>Version:</strong> 1.1',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Add compact public scoring rubric + a guide to reading the study after Methodology.
          marker = '''    <p class="note"><strong>Important:</strong> this study analyses observable employer communication, not actual employee experience. Public outputs contain no company names or company-level rankings.</p>\n  </div>\n</section>'''
          addition = '''    <p class="note"><strong>Important:</strong> this study analyses observable employer communication, not actual employee experience. Public outputs contain no company names or company-level rankings.</p>

    <div class="rubric-summary">
      <p class="eyebrow">Public scoring rubric</p>
      <h3>How to read the 1–5 scores</h3>
      <p>The five scoring dimensions use qualitative expert judgement. Version 1.1 formalises the public anchors so readers can see what a low, medium or high score means. The full dimension-by-dimension rubric is published in the methodology.</p>
      <div class="rubric-scale">
        <div><b>1</b><span>Absent, generic or inconsistent</span></div>
        <div><b>2</b><span>Weak, limited or mostly generic</span></div>
        <div><b>3</b><span>Clear in parts, but mixed</span></div>
        <div><b>4</b><span>Strong, specific and well supported</span></div>
        <div><b>5</b><span>Highly specific, ownable and consistently evidenced</span></div>
      </div>
      <a class="rubric-link" href="methodology.md#public-scoring-rubric-1-5">See the full scoring rubric →</a>
    </div>
  </div>
</section>

<section class="section research-guide">
  <div class="shell">
    <p class="eyebrow">How to read this study</p>
    <h2>Data, interpretation and recommendation are intentionally separated.</h2>
    <div class="threecards">
      <article><b>01</b><h3>Data</h3><p>Observed frequencies, coded themes and 1–5 assessment scores from the sampled employer communication.</p></article>
      <article><b>02</b><h3>Interpretation</h3><p>What those observed patterns may mean for Employer Brand differentiation. These are researcher judgements, not measured facts.</p></article>
      <article><b>03</b><h3>Recommendation</h3><p>Practical actions derived from the findings. They are suggestions for practice, not claims about individual employers.</p></article>
    </div>
  </div>
</section>'''
          if 'Public scoring rubric' not in text:
              text = text.replace(marker, addition)

          # Add illustrative before/after examples before the recommendations section.
          example_marker = '<section id="recommendations" class="section dark">'
          examples = '''<section class="section soft">
  <div class="shell">
    <p class="eyebrow">Illustrative examples · Recommendation</p>
    <h2>From generic promise to ownable expression.</h2>
    <p class="sectionlead muted">These are illustrative rewrites, not quotations from sampled employers. Bracketed details show where an employer would insert its own evidence.</p>
    <div class="threecards examplecards">
      <article>
        <span class="example-tag">International</span>
        <h3>Before</h3><p class="example-before">“Join an international team.”</p>
        <h3>After</h3><p>“Build [product] with teams across [markets / locations], using [specific collaboration model] and owning [cross-market responsibility].”</p>
        <small>Why stronger: it explains what “international” changes about the actual work.</small>
      </article>
      <article>
        <span class="example-tag">Growth</span>
        <h3>Before</h3><p class="example-before">“We support your professional growth.”</p>
        <h3>After</h3><p>“Grow through [career paths], [learning mechanism] and a clear [promotion / feedback practice] that shows how progression happens.”</p>
        <small>Why stronger: the promise is connected to a visible mechanism.</small>
      </article>
      <article>
        <span class="example-tag">Impact</span>
        <h3>Before</h3><p class="example-before">“Make an impact.”</p>
        <h3>After</h3><p>“Own [specific product / problem] used by [audience / scale], with direct responsibility for [decision or outcome].”</p>
        <small>Why stronger: impact becomes concrete, bounded and believable.</small>
      </article>
    </div>
  </div>
</section>

'''
          if 'From generic promise to ownable expression.' not in text:
              text = text.replace(example_marker, examples + example_marker)

          # Add styles for the new research sections to the existing inline style block.
          css = '''
    .rubric-summary{margin-top:34px;padding:28px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:var(--shadow)}
    .rubric-summary h3{font:30px/1.15 Georgia,serif;margin:6px 0 10px}.rubric-summary>p:not(.eyebrow){color:var(--muted)}
    .rubric-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.rubric-scale div{padding:16px;border-radius:18px;background:var(--soft);border:1px solid var(--line)}.rubric-scale b{font:30px Georgia,serif;color:var(--teal);display:block}.rubric-scale span{font-size:12px;color:var(--muted);line-height:1.35}.rubric-link{color:var(--teal);font-weight:750;text-decoration:none;border-bottom:1px solid}
    .research-guide{padding-top:78px;padding-bottom:78px}.examplecards article h3{font:22px/1.1 Georgia,serif;margin:14px 0 8px}.examplecards article p{color:var(--ink)!important}.examplecards .example-before{color:var(--muted)!important;font-style:italic}.examplecards small{display:block;margin-top:16px;color:var(--muted);line-height:1.45}.example-tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--teal)}
    @media(max-width:980px){.rubric-scale{grid-template-columns:1fr 1fr 1fr}}@media(max-width:680px){.rubric-scale{grid-template-columns:1fr}}
'''
          if '.rubric-summary{' not in text:
              text = text.replace('  </style>', css + '  </style>')

          p.write_text(text, encoding='utf-8')

          # ---------- methodology.md ----------
          p = Path('methodology.md')
          md = p.read_text(encoding='utf-8')
          md = md.replace('**Version:** 1.0', '**Version:** 1.1')

          rubric = r'''
## Public scoring rubric (1–5)

The original study uses five qualitative assessment dimensions. **Version 1.1 formalises the public anchors for that scoring framework** so readers can inspect how low, medium and high scores should be interpreted. Scores remain expert judgements rather than statistical measurements.

### Specificity

| Score | Public anchor |
|---|---|
| **1** | Mostly abstract claims; little or no description of concrete practices, context or examples. |
| **2** | Occasional specific detail, but communication is still dominated by broad employer language. |
| **3** | A visible mix of generic claims and concrete practices; the employer experience is partly tangible. |
| **4** | Most priority claims are expressed through concrete practices, examples, context or clearly defined ways of working. |
| **5** | Communication is consistently precise and richly specific, using distinctive details, examples, mechanisms or quantified context where relevant. |

### Distinctiveness

| Score | Public anchor |
|---|---|
| **1** | Proposition is highly interchangeable with competitors and relies almost entirely on category language. |
| **2** | A small number of differentiated cues appear, but the overall proposition remains mostly generic. |
| **3** | Some recognisable employer-specific cues are present, alongside substantial category language. |
| **4** | Several ownable cues are clearly tied to this employer’s product, culture, working model, employee identity or candidate experience. |
| **5** | The proposition is unmistakably employer-specific and would be difficult for a competitor to claim credibly without changing the underlying reality. |

### Candidate Value Clarity

| Score | Public anchor |
|---|---|
| **1** | Candidate benefit is unclear or difficult to infer. |
| **2** | Benefits are present but mostly implied, fragmented or hard to prioritise. |
| **3** | The main reasons to join are understandable, but the proposition is somewhat diffuse or uneven. |
| **4** | Candidate value is clear, coherent and easy to identify across the communication. |
| **5** | The communication gives an immediate, coherent and prioritised answer to “Why should this candidate join this employer?” |

### Evidence

| Score | Public anchor |
|---|---|
| **1** | Employer claims are largely unsupported. |
| **2** | A few isolated examples or proof points appear, but most claims remain unsubstantiated. |
| **3** | Several important claims are supported by concrete practices, examples or employee / product evidence. |
| **4** | Most priority claims are backed by credible, relevant and concrete proof. |
| **5** | Evidence is systematic: key claims are consistently supported by quantified, procedural, product, employee or candidate-experience proof where appropriate. |

### Cross-channel Consistency

| Score | Public anchor |
|---|---|
| **1** | Career page, job ads and recent employer content feel fragmented or contradictory. |
| **2** | Limited overlap exists, but the employer proposition changes noticeably by channel. |
| **3** | Core themes recur across channels, though emphasis and execution are uneven. |
| **4** | The same core proposition is clearly sustained across most candidate-facing layers. |
| **5** | The same strategic meaning is consistently visible across all three layers, while execution appropriately adapts to each format. |

The rubric is designed to make the analytical logic inspectable. It does **not** make the study a population estimate or a psychometrically validated scale.
'''
          anchor = '## Semantic coding rule'
          if '## Public scoring rubric (1–5)' not in md:
              md = md.replace(anchor, rubric + '\n' + anchor)
          p.write_text(md, encoding='utf-8')

          # ---------- README.md ----------
          p = Path('README.md')
          rd = p.read_text(encoding='utf-8')
          rd = rd.replace('Research snapshot: **September 2026** · Version **1.0**', 'Research snapshot: **September 2026** · Version **1.1**')
          rd = rd.replace('`methodology.md` — sample, coding rules, Logo Swap Test, limitations and AI-use disclosure', '`methodology.md` — sample, public 1–5 scoring rubric, coding rules, Logo Swap Test, limitations and AI-use disclosure')
          p.write_text(rd, encoding='utf-8')
          PY

      - name: Commit research refinements
        run: |
          git config user.name 'olesiabositi-hub'
          git config user.email 'olesia.russi@gmail.com'
          git add index.html methodology.md README.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Refine study into concise practitioner research'
            git push
          fi
